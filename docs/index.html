<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Unity Web Player | PortfolioProject</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #231F20; /* same as canvas background */
        overflow: hidden; /* prevents scrollbars */
      }

      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #231F20;
      }
    </style>
  </head>

  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/docs.loader.js"></script>
    <script>
      // Set up Unity instance with responsive canvas
      const canvas = document.querySelector("#unity-canvas");

      // Initialize Unity
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/docs.data.unityweb",
        frameworkUrl: "Build/docs.framework.js.unityweb",
        codeUrl: "Build/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Thomas Carnell",
        productName: "PortfolioProject",
        productVersion: "0.1",
      });

      // Auto-resize Unity canvas on window resize
      window.addEventListener('resize', () => {
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
      });
    </script>
  </body>
</html>
