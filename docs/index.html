<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Unity Web Player | PortfolioProject</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #231F20;
        overflow: hidden;
      }

      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #231F20;
      }

      /* Optional fade-in effect */
      #myText {
        opacity: 0;
        transition: opacity 2s ease;
        color: white;
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-family: sans-serif;
      }

      .fade-in {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <!-- Your Unity canvas -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- Optional text element -->
    <div id="myText">Welcome to my Portfolio!</div>

    <!-- Load Unity -->
    <script src="Build/docs.loader.js"></script>

    <!-- Wait until Unity fully loads -->
    <script>
      const canvas = document.querySelector("#unity-canvas");

      createUnityInstance(canvas, {
        dataUrl: "Build/docs.data.unityweb",
        frameworkUrl: "Build/docs.framework.js.unityweb",
        codeUrl: "Build/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Thomas Carnell",
        productName: "PortfolioProject",
        productVersion: "0.1",
      })
      .then((unityInstance) => {
        console.log("✅ Unity WebGL fully loaded!");
        startTextFadeIn(); // Only runs after Unity is ready
      })
      .catch((message) => {
        console.error("❌ Unity failed to load:", message);
      });

      // Your fade animation
      function startTextFadeIn() {
        const text = document.querySelector("#myText");
        text.classList.add("fade-in");
      }
    </script>
  </body>
</html>
